name: AI Auto Publish

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Get Google News RSS
        run: |
          mkdir -p 投稿
          curl -L -A "Mozilla/5.0" \
          "https://news.google.com/rss/search?q=高校サッカー&hl=ja&gl=JP&ceid=JP:ja" \
          -o 投稿/news.xml

      - name: Extract Latest News
        run: |
          TITLE=$(grep -oPm1 "(?<=<title>).*?(?=</title>)" 投稿/news.xml | tail -n 1)
          echo "$TITLE"
          echo "$TITLE" > 投稿/title.txt

      - name: Generate AI Post
        run: |
          TITLE=$(cat 投稿/title.txt)

          curl https://api.openai.com/v1/chat/completions \
          -H "Authorization: Bearer $OPENAI_API_KEY" \
          -H "Content-Type: application/json" \
          -d "{
            \"model\":\"gpt-4.1-mini\",
            \"messages\":[
              {
                \"role\":\"user\",
                \"content\":\"次のニュースをX投稿用に280文字以内で要約してください: $TITLE\"
              }
            ]
          }" \
          | jq -r '.choices[0].message.content' \
          > 投稿/post.txt

          echo "===== 投稿 ====="
          cat 投稿/post.txt

        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Upload Files
        uses: actions/upload-artifact@v4
        with:
          name: ai-post
          path: 投稿/
