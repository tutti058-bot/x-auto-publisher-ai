name: AI Auto Publish

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: |
          sudo apt update
          sudo apt install -y jq

      - name: Get NewsAPI
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          mkdir -p 投稿
          mkdir -p posts

          curl -L \
          "https://newsapi.org/v2/top-headlines?country=us&category=sports&pageSize=1&apiKey=$NEWS_API_KEY" \
          -o 投稿/news.json

          cat 投稿/news.json

      - name: Extract Title
        run: |
          jq -r '.articles[0].title' 投稿/news.json > 投稿/title.txt
          echo "===== TITLE ====="
          cat 投稿/title.txt

      - name: Extract Image
        run: |
          jq -r '.articles[0].urlToImage' 投稿/news.json > posts/image.txt

      - name: Extract URL
        run: |
          jq -r '.articles[0].url' 投稿/news.json > posts/url.txt

      - name: Generate AI Post
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          TITLE=$(cat 投稿/title.txt)

          curl https://api.openai.com/v1/chat/completions \
          -H "Authorization: Bearer $OPENAI_API_KEY" \
          -H "Content-Type: application/json" \
          -d "{
            \"model\":\"gpt-4.1-mini\",
            \"messages\":[
              {
                \"role\":\"user\",
                \"content\":\"次のスポーツニュースを日本語でタイトルを付け、その後に280文字以内で要約してください。1行目をタイトル、2行目以降を本文にしてください。ハッシュタグを3個付けてください。\n\n$TITLE\"
              }
            ]
          }" \
          | jq -r '.choices[0].message.content' > 投稿/post.txt

          echo "===== POST ====="
          cat 投稿/post.txt

      - name: Save Image URL
        run: |
          mkdir -p posts

          jq -r '.articles[0].urlToImage' 投稿/news.json > posts/image.txt

          if [ ! -s posts/image.txt ]; then
            echo "https://placehold.co/1200x700?text=AI+NEWS" > posts/image.txt
          fi
      - name: Commit Files
        run: |
          mkdir -p posts

          cp 投稿/post.txt posts/post.txt

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add 投稿
          git add posts

          git diff --cached --quiet || git commit -m "Auto post"

          git push
