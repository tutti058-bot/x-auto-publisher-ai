name: AI Auto Publish

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: |
          sudo apt update
          sudo apt install -y jq

      - name: Get NewsAPI
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          mkdir -p 投稿

          curl -L \
          "https://newsapi.org/v2/top-headlines?country=jp&pageSize=1&apiKey=$NEWS_API_KEY" \
          -o 投稿/news.json

          cat 投稿/news.json

      - name: Extract Title
        run: |
          jq -r '.articles[0].title' 投稿/news.json > 投稿/title.txt
          echo "===== TITLE ====="
          cat 投稿/title.txt

      - name: Generate AI Post
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          TITLE=$(cat 投稿/title.txt)

          curl https://api.openai.com/v1/chat/completions \
          -H "Authorization: Bearer $OPENAI_API_KEY" \
          -H "Content-Type: application/json" \
          -d "{
            \"model\":\"gpt-4.1-mini\",
            \"messages\":[
              {
                \"role\":\"user\",
                \"content\":\"次のニュースをX用に280文字以内で要約してください。\n\n$TITLE\"
              }
            ]
          }" |
          jq -r '.choices[0].message.content'
