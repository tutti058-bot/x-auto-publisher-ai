name: AI Auto Publish

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test
        run: |
          echo "GitHub Actions is working!"
          date
      - name: Check API Key
        run: echo "API Key is loaded"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
