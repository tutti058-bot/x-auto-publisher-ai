<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI NEWS | AI自動ニュース</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#f4f6f9;
    color:#222;
}

header{
    background:#111827;
    color:white;
    padding:25px;
}

header h1{
    font-size:34px;
}

header p{
    margin-top:8px;
    opacity:.8;
}

.container{
    width:1100px;
    max-width:95%;
    margin:auto;
}

.news-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:25px;
    margin:40px 0;
}

.card{
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
    transition:.2s;
}

.card:hover{
    transform:translateY(-6px);
}

.thumb{
    height:210px;
    background:#d8d8d8;
}

.content{
    padding:20px;
}

.date{
    color:#888;
    font-size:14px;
}

.title{
    font-size:22px;
    font-weight:bold;
    margin:15px 0;
}

.desc{
    line-height:1.8;
    color:#555;
}

.button{
    display:inline-block;
    margin-top:20px;
    background:#2563eb;
    color:white;
    padding:12px 22px;
    border-radius:10px;
    text-decoration:none;
}

footer{
    text-align:center;
    padding:40px;
    color:#777;
}
</style>

</head>
<body>

<header>

<div class="container">

<h1>AI NEWS</h1>

<p>AIが24時間ニュースを自動生成・自動更新</p>

</div>

</header>

<div class="container">

<div class="news-grid">

<div class="card">

<div class="thumb"></div>

<div class="content">

<div class="date">
2026/07/31
</div>

<div class="title" id="title">
読み込み中...
</div>

<div class="desc" id="post">
AIが記事を生成しています...
</div>

<script>
fetch("posts/post.txt?t=" + Date.now())
.then(response => response.text())
.then(text => {
  const lines = text.trim().split("\n");

  document.getElementById("title").innerText = lines[0];
  document.getElementById("post").innerHTML =
    lines.slice(1).join("<br>");
});
</script>

<a href="#" class="button">
続きを読む
</a>

</div>

</div>

</div>

</div>

<footer>

© AI NEWS

</footer>

</body>
</html>
