<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI NEWS | AI自動ニュース</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:#f4f6f9;
color:#222;
}

header{
background:#111827;
color:white;
padding:25px;
}

header h1{
font-size:34px;
}

header p{
margin-top:8px;
opacity:.8;
}

.container{
width:1100px;
max-width:95%;
margin:auto;
}

.news-grid{
display:grid;
grid-template-columns:1fr;
margin:40px 0;
}

.card{
background:white;
border-radius:18px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.thumb{
    width:100%;
    height:420px;
    background:#ddd;
    display:flex;
    justify-content:center;
    align-items:center;
}

.thumb img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.content{
padding:24px;
}

.date{
color:#888;
font-size:14px;
}

.title{
font-size:34px;
font-weight:bold;
margin:15px 0;
line-height:1.4;
}

.desc{
font-size:20px;
line-height:1.9;
color:#555;
margin-top:15px;
}

.button{
display:inline-block;
margin-top:25px;
background:#2563eb;
color:white;
padding:14px 28px;
border-radius:10px;
text-decoration:none;
font-weight:bold;
}

.button:hover{
background:#1d4ed8;
}

footer{
text-align:center;
padding:40px;
color:#777;
}

</style>

</head>

<body>

<header>

<div class="container">

<h1>AI NEWS</h1>

<p>AIが24時間ニュースを自動生成・自動更新</p>

</div>

</header>

<div class="container">

  <div id="news-list" class="news-grid"></div>

</div>

<footer>

© AI NEWS

</footer>

<script src="public/app.js"></script>

</body>
</html>
